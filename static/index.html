<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScraperPro | OSINT Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🕷️</span> ScraperPro <span class="badge">OSINT</span>
            </div>
            <div class="status-indicator">
                <span id="status-dot" class="dot"></span>
                <span id="status-text">Ready</span>
            </div>
        </header>

        <main>
            <section class="control-panel">
                <div class="input-group">
                    <input type="url" id="seed-url" placeholder="Enter target URL (e.g., https://example.com)..." required>
                </div>
                <div class="actions">
                    <button id="start-btn" onclick="startCrawl()">
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Start Operation
                    </button>
                    <button id="stop-btn" onclick="stopCrawl()" disabled>
                        <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                        Stop
                    </button>
                </div>
            </section>

            <div class="dashboard-grid">
                <section class="logs-panel glass-panel">
                    <h3><span class="icon">📜</span> Live Logs</h3>
                    <div id="logs-container" class="logs-content">
                        <div class="log-entry system">System ready. Waiting for target...</div>
                    </div>
                </section>

                <section class="results-panel glass-panel">
                    <h3><span class="icon">🎯</span> Extracted Intelligence <span id="result-count" class="count">0</span></h3>
                    <div class="table-container">
                        <table id="results-table">
                            <thead>
                                <tr>
                                    <th>URL</th>
                                    <th>Emails Found</th>
                                    <th>Time</th>
                                    <th>Snapshot</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Results will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
